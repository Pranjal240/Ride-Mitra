<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C8956C" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ride Mitra - Campus Carpooling for JC Bose University. Share rides, save money, travel safe." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://apis.mappls.com/advancedmaps/api/MAPPLS_REST_KEY/map_sdk_plugins?v=3.0&libraries=search,places" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <title>Ride Mitra - Campus Carpooling</title>
    <style>
      :root { color-scheme: light; }
      /* html is the light fallback behind the app-wide animated grid; body MUST
         be transparent or its background paints OVER the negative-z grid layer. */
      html { background: #F1EADD; }
      body { background: transparent; color: #2B2D42; margin: 0; padding: 0; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #F1EADD; }
      ::-webkit-scrollbar-thumb { background: #E4E5E9; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #C8956C; }

      /* Instant pre-React loader (no white flash on mobile). React replaces
         #root's children on mount, so this is removed the moment the app is ready. */
      .rm-boot {
        position: fixed; inset: 0; z-index: 99999; background: #0F1A33;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        font-family: 'Poppins', system-ui, -apple-system, sans-serif; text-align: center;
      }
      .rm-boot .rm-loader { position: relative; width: 116px; height: 116px; display: grid; place-items: center; animation: rm-pop .5s cubic-bezier(.22,1,.36,1) both; }
      .rm-boot .rm-loader .blob { position: absolute; width: 100%; height: 100%; background: #C8956C; opacity: .92; border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; animation: rm-morph 3.2s ease-in-out infinite; }
      .rm-boot .rm-loader .mark { position: relative; z-index: 1; width: 64px; height: 64px; }
      .rm-boot .wm { margin-top: 22px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #fff; }
      .rm-boot .wm b { color: #C8956C; }
      .rm-boot .kick { margin-top: 8px; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,.55); }
      @keyframes rm-pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
      @keyframes rm-morph {
        0%,100% { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; transform: rotate(0deg) scale(1); }
        25%     { border-radius: 58% 42% 45% 55% / 55% 55% 45% 45%; }
        50%     { border-radius: 63% 37% 58% 42% / 56% 41% 59% 44%; transform: rotate(180deg) scale(1.05); }
        75%     { border-radius: 40% 60% 42% 58% / 59% 44% 56% 41%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="rm-boot" aria-hidden="true">
        <div class="rm-loader">
          <div class="blob"></div>
          <svg class="mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="23" fill="rgba(255,255,255,0.96)" stroke="#C8956C" stroke-width="2"/>
            <path d="M12 28h24v4c0 1.1-.9 2-2 2H14c-1.1 0-2-.9-2-2v-4z" fill="#1B2B4B"/>
            <path d="M14 28l3-8h14l3 8" fill="rgba(255,255,255,0.96)" stroke="#1B2B4B" stroke-width="1.5"/>
            <circle cx="17" cy="32" r="2.5" fill="rgba(255,255,255,0.96)" stroke="#C8956C" stroke-width="1.5"/>
            <circle cx="31" cy="32" r="2.5" fill="rgba(255,255,255,0.96)" stroke="#C8956C" stroke-width="1.5"/>
            <path d="M24 8c-2.8 0-5 2.2-5 5 0 3.5 5 8 5 8s5-4.5 5-8c0-2.8-2.2-5-5-5z" fill="#C8956C"/>
            <circle cx="24" cy="13" r="2" fill="rgba(255,255,255,0.96)"/>
          </svg>
        </div>
        <div class="wm">Ride<b>Mitra</b></div>
        <div class="kick">Campus Ride Network</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
